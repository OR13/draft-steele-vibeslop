extends: script
message: "%s"
link: https://www.rfc-editor.org/rfc/rfc7322.html#section-3.3
level: warning
scope: ~text.frontmatter
script: |
  text := import("text")
  matches := []
  found := text.re_find("https?://[^\\s<>]+", scope, -1)
  for f in found {
    m := f[0]
    before := ""
    if m.begin > 0 {
      before = scope[m.begin-1:m.begin]
    }
    // YAML metadata values (key: value) are data, not prose.
    line_start := text.last_index(scope[:m.begin], "\n") + 1
    prefix := scope[line_start:m.begin]
    if text.re_match("^\\s*#?\\s*(-\\s+)?\\s*[A-Za-z_-]+:\\s*\"?$", prefix) {
      continue
    }
    if before == "<" || before == "(" || before == "`" || before == "\\\"" {
      continue
    }
    matches = append(matches, {
      begin: m.begin,
      end: m.begin + len(m.text),
      message: "Enclose this URI in angle brackets."
    })
  }
