StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Vibeslop
SkippedScopes = text.frontmatter

Packages = https://github.com/OR13/ietf-vale/releases/latest/download/IETF-Draft.zip, \
           https://github.com/OR13/ietf-vale/releases/latest/download/IETF-Draft-Optional.zip

[*.md]
BasedOnStyles = Vale, IETF-Draft, IETF-Draft-Optional, Vibeslop
# kramdown-rfc anchors, attributes, and references are markup, not prose.
TokenIgnores = (\{\#[^}]+\}), (\{:[^}]+\}), (\{\{[^}]+\}\})
Vale.Terms = NO
# Use the local rule to keep spelling vocabulary separate from expansions
# and exempt BCP 14 requirement words, which are not abbreviations.
IETF-Draft.Abbreviations = NO
IETF-Draft.AngleBracketsURI = NO
# The i-d-template expands {::boilerplate bcp14-tagged} during rendering.
IETF-Draft.Bcp14Boilerplate = NO
